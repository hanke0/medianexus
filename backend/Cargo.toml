[package]
name = "medianexus-backend"
version = "0.1.0"
edition = "2021"
default-run = "medianexus-backend"

[lib]
name = "medianexus_backend"
path = "src/lib.rs"

[features]
default = []
# Embed `../frontend/dist` into the binary and serve the SPA from Axum.
embed-frontend = ["dep:rust-embed", "dep:mime_guess"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
jsonwebtoken = "10"
bcrypt = "0.17"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "rustls-tls"] }
urlencoding = "2"
futures-util = "0.3"
async-trait = "0.1.92"
rust-embed = { version = "8", optional = true }
mime_guess = { version = "2", optional = true }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
base64 = "0.23.1"
sha1 = "0.10"
sha2 = "0.11.1"
getrandom = { version = "0.4.3", features = ["std"] }
if-addrs = "0.14"

[[bin]]
name = "medianexus-backend"
path = "src/main.rs"
